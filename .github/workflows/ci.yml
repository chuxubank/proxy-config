---
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install ansible-core

      - name: Install Galaxy requirements
        run: make deps

      - name: Install sing-box
        run: curl -fsSL https://sing-box.app/install.sh | sudo sh

      - name: Run CI
        run: make ci

      - name: Stage rendered profiles
        run: |
          mkdir -p "${{ runner.temp }}/sing-box-profiles"
          cp tests/.render/*.json "${{ runner.temp }}/sing-box-profiles/"

      - name: Upload rendered profiles
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-profiles
          path: ${{ runner.temp }}/sing-box-profiles/*.json
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install ansible-core

      - name: Install Galaxy requirements
        run: make deps

      - name: Install sing-box
        run: |
          set -euo pipefail
          tmp="${{ runner.temp }}/sing-box-dl"
          mkdir -p "$tmp" "$HOME/.local/bin"
          url=$(python3 -c '
          import json, os, urllib.request
          req = urllib.request.Request(
              "https://api.github.com/repos/SagerNet/sing-box/releases/latest",
              headers={"User-Agent": "proxy-config-ci"},
          )
          with urllib.request.urlopen(req) as resp:
              rel = json.load(resp)
          tag = rel["tag_name"].lstrip("v")
          arch = {"x86_64": "amd64", "arm64": "arm64", "aarch64": "arm64"}[os.uname().machine]
          name = f"sing-box-{tag}-darwin-{arch}.tar.gz"
          print(next(a["browser_download_url"] for a in rel["assets"] if a["name"] == name))
          ')
          curl -fsSL "$url" | tar -xz -C "$tmp"
          bin=$(find "$tmp" -type f -name sing-box | head -n1)
          install -m 755 "$bin" "$HOME/.local/bin/sing-box"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run CI
        run: make ci

  windows:
    runs-on: windows-latest
    needs: linux
    steps:
      - name: Download rendered profiles
        uses: actions/download-artifact@v4
        with:
          name: sing-box-profiles
          path: profiles

      - name: Install sing-box
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $rel = Invoke-RestMethod -Uri 'https://api.github.com/repos/SagerNet/sing-box/releases/latest'
          $asset = $rel.assets |
            Where-Object { $_.name -match 'windows-amd64\.zip$' } |
            Select-Object -First 1
          if (-not $asset) { throw 'windows-amd64 zip not found on latest release' }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile sing-box.zip
          Expand-Archive -Path sing-box.zip -DestinationPath sing-box-dist -Force
          $exe = Get-ChildItem -Path sing-box-dist -Recurse -Filter sing-box.exe |
            Select-Object -First 1
          if (-not $exe) { throw 'sing-box.exe not found in release zip' }
          Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName

      - name: Check profiles
        shell: pwsh
        run: |
          Get-ChildItem profiles -Filter *.json | ForEach-Object {
            & sing-box.exe check -c $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "sing-box check failed: $($_.Name)" }
          }
