sing_box_config_dir: "{{ ansible_facts['env']['HOME'] }}/.config/sing-box"
sing_box_log_dir: "{{ log_dir }}/sing-box"
sing_box_logrotate_config: "{{ logrotate_config_dir }}/sing-box"
sing_box_service_template: >-
  {%- if ansible_facts['system'] == 'Darwin' -%}
  service.plist.j2
  {%- elif ansible_facts['system'] == 'Linux' -%}
  service.systemd.j2
  {%- else -%}
  service.conf.j2
  {%- endif -%}

sing_box_tailscale_auth_token: "{{ lookup('community.general.passwordstore', 'Network/Tailscale', subkey='auth-key-sing-box') }}"
sing_box_tailscale_relay_server_port: "{{ lookup('community.general.passwordstore', 'Network/Tailscale', subkey='relay-server-port') }}"
sing_box_tailscale_relay_server_static_endpoints: "{{ lookup('community.general.passwordstore', 'Network/Tailscale', subkey='relay-server-static-endpoints') }}"
