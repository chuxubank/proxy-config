---
# false stops/disables the host service and skips install/config/export tasks.
sing_box_service_enabled: true
# Steady-state level. trace and debug are noisy on OpenWrt and iOS PacketTunnel.
sing_box_log_level: info

sing_box_tailscale_auth_token: >-
  {{ lookup('community.general.passwordstore', 'Network/Tailscale', subkey='auth-key-sing-box') }}

# OpenWrt sing-box 1.13 peer relay. Only that profile's ts-ep reads these.
# The endpoint does not advertise a tag. Assign the tag and the
# tailscale.com/cap/relay grant in the Tailscale admin console. Allow this
# UDP port on the host firewall; the OpenWrt role does not add that rule.
# See docs/clients.org.
# The DDNS hostname is resolved with community.dns while rendering the
# OpenWrt profile. sing-box accepts only ip:port in
# relay_server_static_endpoints. The lookup needs dnspython.
sing_box_asus_pass_path: "Network/Home/ASUS"
sing_box_tailscale_relay_ddns: >-
  {{ lookup('community.general.passwordstore', sing_box_asus_pass_path, subkey='ddns') }}
sing_box_tailscale_relay_server_port: 40000

sing_box_invalley_server: >-
  {{ lookup('community.general.passwordstore', invalley_pass_path, subkey='url') }}
sing_box_invalley_uuid: >-
  {{ lookup('community.general.passwordstore', invalley_pass_path) }}
sing_box_invalley_ws_path: >-
  {{ lookup('community.general.passwordstore', invalley_pass_path, subkey='ws_path') }}

# Portable profiles drop the host-local log path and the site-local outbounds
# gated on host_env. The remote IV outbound and Tailscale are kept, so
# exports carry the IV credentials and sing_box_tailscale_auth_token.
# Every profile, including portable exports, routes invalley.co through that
# outbound. TUN routes stay at the platform defaults.
# See the export tasks for file mode.
sing_box_icloud_profile: false
# File name inside iCloud Drive/sing-box; used as the Path when adding an
# iCloud profile in SFI/SFM.
sing_box_icloud_profile_file: sing-box.json
# Windows desktop keeps the loopback API/dashboard; iCloud drops it.
sing_box_windows_profile: false
sing_box_windows_profile_file: sing-box.json
sing_box_windows_profile_dir: "{{ sing_box_config_dir }}/windows"
