- name: Abort when package manager is not pacman
  ansible.builtin.fail:
    msg: "Linux install supports pacman-based systems (e.g., CachyOS/Arch) only."
  when: ansible_facts.pkg_mgr != 'pacman'

- name: Install sing-box via pacman
  become: "{{ use_become | default(true) }}"
  community.general.pacman:
    name: sing-box
    state: present
    update_cache: true

- name: Deploy sing-box systemd unit
  become: "{{ use_become | default(true) }}"
  ansible.builtin.template:
    src: "{{ sing_box_service_template }}"
    dest: /etc/systemd/system/sing-box.service
    mode: "0644"
  notify:
    - Restart sing-box service

- name: Ensure sing-box service is enabled and started
  become: "{{ use_become | default(true) }}"
  ansible.builtin.systemd:
    name: sing-box.service
    enabled: true
    state: started
    daemon_reload: true
