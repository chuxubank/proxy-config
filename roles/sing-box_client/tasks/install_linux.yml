- name: Render sing-box systemd unit content
  ansible.builtin.set_fact:
    sing_box_service_content: "{{ lookup('template', sing_box_service_template) }}"

- name: Install sing-box and service via pacman helper
  ansible.builtin.include_role:
    name: common
    tasks_from: install_pacman_service
  vars:
    package_list:
      - sing-box
    service_name: sing-box
    service_content: "{{ sing_box_service_content }}"
    service_notify:
      - Restart sing-box service
