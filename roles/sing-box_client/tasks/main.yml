---
- name: Validate client service switch
  ansible.builtin.assert:
    that: sing_box_service_enabled is boolean
    fail_msg: sing_box_service_enabled must be a YAML boolean.
  tags: [always]

- name: Configure enabled client
  ansible.builtin.import_tasks: configure.yml
  when: sing_box_service_enabled

- name: Stop disabled client without installing or rendering secrets
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/../common/tasks/stop_service.yml"
    apply:
      tags: [service]
  vars:
    service_name: sing-box
    service_on_openwrt: "{{ sing_box_on_openwrt }}"
    service_openwrt_uci_key: sing-box.main.enabled
    service_openwrt_uci_package: sing-box
  when: not sing_box_service_enabled
  tags: [service]
