---
- name: Include sing-box install tasks
  ansible.builtin.include_tasks: install.yml
  tags: install

- name: Ensure sing-box config directory exists
  ansible.builtin.file:
    path: "{{ sing_box_config_dir }}"
    state: directory
    mode: "0755"
    owner: "{{ sing_box_on_openwrt | ternary('root', ansible_facts['user_id']) }}"

- name: Ensure sing-box log directory exists
  become: "{{ (not sing_box_on_openwrt) and (use_become | default(false)) }}"
  ansible.builtin.file:
    path: "{{ sing_box_log_dir }}"
    state: directory
    mode: "0755"
    owner: "{{ ansible_facts['user_id'] }}"
  when: not sing_box_on_openwrt

- name: Ensure logrotate config directory exists
  become: "{{ use_become | default(false) }}"
  ansible.builtin.file:
    path: "{{ logrotate_config_dir }}"
    state: directory
    mode: "0755"
  when: not sing_box_on_openwrt

- name: Setup logrotate
  become: "{{ use_become | default(false) }}"
  ansible.builtin.template:
    src: logrotate.j2
    dest: "{{ sing_box_logrotate_config }}"
    mode: "0644"
  notify:
    - Force sing-box log rotation
  when: not sing_box_on_openwrt

- name: Setup sing-box config
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ sing_box_config_file }}"
    mode: "0600"
    validate: "{{ sing_box_binary }} check -c %s"
  notify:
    - Force sing-box log rotation
    - Restart sing-box service

- name: Configure sing-box service on OpenWrt
  ansible.builtin.include_role:
    name: common
    tasks_from: configure_openwrt_service
  vars:
    common_openwrt_service_name: "{{ sing_box_openwrt_service_name }}"
    common_openwrt_uci_package: sing-box
    common_openwrt_uci_options:
      sing-box.main.enabled: "1"
      sing-box.main.user: root
      sing-box.main.conffile: "{{ sing_box_config_file }}"
  when: sing_box_on_openwrt
  tags: install

- name: Configure sing-box service on Linux
  ansible.builtin.include_tasks: service_linux.yml
  when:
    - not sing_box_on_openwrt
    - ansible_facts['system'] == 'Linux'
  tags: install

- name: Export sing-box profile for the Apple clients
  ansible.builtin.include_tasks:
    file: export_icloud.yml
    apply:
      tags: icloud
  when: ansible_facts['system'] == 'Darwin'
  tags: icloud
