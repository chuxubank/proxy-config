---
- name: Ensure Windows profile directory exists
  ansible.builtin.file:
    path: "{{ sing_box_windows_profile_dir }}"
    state: directory
    mode: "0755"

- name: Export sing-box profile for Windows
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ sing_box_windows_profile_dir }}/{{ sing_box_windows_profile_file }}"
    mode: "0600"
    validate: "{{ sing_box_binary }} check -c %s"
  vars:
    sing_box_windows_profile: true
