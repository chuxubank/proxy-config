---
# Controller-only validation/preview; no Compose parser or dependency graph.
- name: Validate host service list
  ansible.builtin.assert:
    that:
      - proxy_services is sequence and proxy_services is not string and proxy_services is not mapping
      - >-
        proxy_services | difference(['caddy', 'xray', 'warp', 'prometheus', 'grafana',
                                     'freshrss', 'rsshub', 'redis', 'browserless', 'asspp']) | length == 0
    fail_msg: proxy_services must be a list of known Compose service names, including dependencies.

- name: Show host service selection
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: {{ proxy_services }}"
