---
# providers.json holds upstream keys. Python on the host reads it from
# `docker exec` and, only when an Anthropic proxy changes, streams the
# replacement into the container. The catalog is never copied onto the host,
# including /tmp. Warp has to be selected; otherwise the hostname would not
# resolve. A provider added later is updated on the next deploy.

- name: Check for a magpie provider catalog
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - magpie
      - /bin/bash
      - -c
      - test -f /config/magpie/providers.json
  register: magpie_providers_file
  changed_when: false
  failed_when: magpie_providers_file.rc not in [0, 1]
  when:
    - not ansible_check_mode
    - "'magpie' in proxy_services"
    - "'warp' in proxy_services"

- name: Point Anthropic providers at WARP
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "{{ lookup('file', role_path ~ '/files/magpie-anthropic-proxy.py') }}"
      - --docker
      - "{{ magpie_anthropic_proxy }}"
  register: magpie_anthropic_proxy_set
  changed_when: "'updated' in magpie_anthropic_proxy_set.stdout"
  no_log: true
  notify: Restart magpie
  when:
    - not ansible_check_mode
    - "'magpie' in proxy_services"
    - "'warp' in proxy_services"
    - magpie_providers_file.rc | default(1) == 0
