---
- name: Validate and show service selection
  ansible.builtin.import_tasks: selection.yml
  tags: [always]

- name: Ensure proxy-config directory exists
  ansible.builtin.file:
    path: "{{ proxy_config_dir }}"
    state: directory
    mode: "0755"

- name: Sync native Compose files and static configuration
  ansible.posix.synchronize:
    src: files/
    delete: true
    rsync_opts:
      - "--exclude=grafana/dashboards/*.json"
      - "--exclude=.env"
      - "--exclude=xray/config.json"
      - "--exclude=caddy/Caddyfile"
      - "--exclude=asspp/mnt/"
      - "--exclude=rss/extensions/"
    dest: "{{ proxy_config_dir }}"
    dest_port: "{{ ansible_port | int }}"
  when: not ansible_check_mode

- name: Download Grafana dashboards
  ansible.builtin.get_url:
    url: "https://grafana.com/api/dashboards/{{ item.id }}/revisions/{{ item.revision }}/download"
    dest: "{{ proxy_config_dir }}/grafana/dashboards/{{ item.filename }}"
    mode: "0644"
  loop: "{{ grafana_dashboards }}"
  when:
    - not ansible_check_mode
    - "'grafana' in proxy_services"

- name: Bind dashboards to the provisioned Prometheus data source
  ansible.builtin.replace:
    path: "{{ proxy_config_dir }}/grafana/dashboards/{{ item.filename }}"
    regexp: '\$\{DS_PROMETHEUS\}'
    replace: prometheus
  loop: "{{ grafana_dashboards }}"
  when:
    - not ansible_check_mode
    - "'grafana' in proxy_services"

- name: Render Caddy routes for selected services
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ proxy_config_dir }}/caddy/Caddyfile"
    mode: "0644"
  when: "'caddy' in proxy_services"

- name: Render Compose environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ proxy_config_dir }}/.env"
    mode: "0600"
  diff: false

- name: Render Xray config
  ansible.builtin.template:
    src: xray/config_server.json.j2
    dest: "{{ proxy_config_dir }}/xray/config.json"
    # Bind-mounted and read by the container's non-root process.
    mode: "0644"
  diff: false
  when: "'xray' in proxy_services"

- name: Render FreshRSS environment
  ansible.builtin.template:
    src: rss_env.j2
    dest: "{{ proxy_config_dir }}/rss/.env"
    mode: "0600"
  diff: false
  when: "'freshrss' in proxy_services"

- name: Render RSSHub environment
  ansible.builtin.template:
    src: rsshub_env.j2
    dest: "{{ proxy_config_dir }}/rsshub/.env"
    mode: "0600"
  diff: false
  when: "'rsshub' in proxy_services"

# Validate and pull before stopping anything. Pull-only selects just this task
# (plus local validation) and operates on the last deployed native Compose files.
- name: Pull selected Compose images
  community.docker.docker_compose_v2_pull:
    project_src: "{{ proxy_config_dir }}"
    project_name: "{{ proxy_compose_project_name }}"
    files: [compose.yml]
    profiles: "{{ proxy_services }}"
  tags: [pull]
  when:
    - not ansible_check_mode
    - proxy_services | length > 0

# The project is exclusively managed here. down removes all its containers,
# including old profiles/orphans, but keeps named volumes and bind-mounted data.
- name: Stop the managed Compose project without deleting volumes
  community.docker.docker_compose_v2:
    project_src: "{{ proxy_config_dir }}"
    project_name: "{{ proxy_compose_project_name }}"
    files: [compose.yml]
    profiles: ['*']
    state: absent
    remove_orphans: true
    remove_volumes: false
  when: not ansible_check_mode

# Recreate every deployment so bind-mounted configs are also reloaded on retry.
- name: Start selected Compose services
  community.docker.docker_compose_v2:
    project_src: "{{ proxy_config_dir }}"
    project_name: "{{ proxy_compose_project_name }}"
    files: [compose.yml]
    profiles: "{{ proxy_services }}"
  when:
    - not ansible_check_mode
    - proxy_services | length > 0

- name: Install the magpie gateway key
  ansible.builtin.import_tasks: magpie_key.yml

- name: Send Anthropic through WARP
  ansible.builtin.import_tasks: magpie_warp.yml
