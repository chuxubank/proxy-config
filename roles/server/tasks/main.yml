---
- name: Ensure proxy-config directory exists
  ansible.builtin.file:
    path: "{{ proxy_config_dir }}"
    state: directory
    mode: "0755"

- name: Sync Docker Compose directory to remote server
  ansible.posix.synchronize:
    src: files/
    delete: true
    dest: "{{ proxy_config_dir }}"
    dest_port: "{{ ansible_port | int }}"
  when: not ansible_check_mode

- name: Setup env
  ansible.builtin.template:
    src: templates/env.j2
    dest: "{{ proxy_config_dir }}/.env"
    mode: "0600"

- name: Setup xray config
  ansible.builtin.template:
    src: templates/xray/config_server.json.j2
    dest: "{{ proxy_config_dir }}/xray/config.json"
    # Bind-mounted into the xray container and read by its non-root process,
    # so it must stay world-readable; 0600 causes "permission denied".
    mode: "0644"

- name: Setup rss env
  ansible.builtin.template:
    src: templates/rss_env.j2
    dest: "{{ proxy_config_dir }}/rss/.env"
    mode: "0600"
  when: rss_pass_path is defined

- name: Setup rsshub env
  ansible.builtin.template:
    src: templates/rsshub_env.j2
    dest: "{{ proxy_config_dir }}/rsshub/.env"
    mode: "0600"
  when: rss_pass_path is defined

- name: Stop Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ proxy_config_dir }}"
    profiles: "{{ proxy_profile }}"
    state: stopped
  register: compose_stop
  # Tolerate "nothing to stop" on first run; surface any other failure.
  failed_when:
    - compose_stop is failed
    - "'no container found' not in (compose_stop.msg | default(''))"
    - "'not found' not in (compose_stop.msg | default(''))"
  tags: always
  when: not ansible_check_mode

- name: Pull Docker Compose
  community.docker.docker_compose_v2_pull:
    project_src: "{{ proxy_config_dir }}"
    profiles: "{{ proxy_profile }}"
  tags: pull
  when: not ansible_check_mode

- name: Run Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ proxy_config_dir }}"
    profiles: "{{ proxy_profile }}"
    remove_orphans: true
  tags: always
  when: not ansible_check_mode
