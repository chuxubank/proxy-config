---
# Base directory for generated Compose files and templates.
proxy_config_dir: proxy-config
# Keep the historical Compose project identity (directory basename) for cleanup.
proxy_compose_project_name: "{{ proxy_config_dir | regex_replace('/+$', '') | basename | lower }}"
# Complete per-host selection, including dependencies; [] disables the project.
# Each native Compose profile has the same name as its service.
proxy_services: [caddy, xray, warp, prometheus, grafana]

# Set true on a host to refuse subscription sign-in.
magpie_no_accounts: false

# Grafana dashboards fetched from grafana.com at deploy time (not committed).
# id/revision map to https://grafana.com/api/dashboards/<id>/revisions/<revision>/download
grafana_dashboards:
  - id: 24146
    revision: 1
    filename: caddy-hosts.json
