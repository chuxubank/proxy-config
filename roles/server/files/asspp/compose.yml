services:
  asspp:
    image: ghcr.io/lakr233/assppweb:latest
    profiles:
      - asspp
    expose:
      - "8080"
    volumes:
      - ./mnt/asspp-data:/data
    environment:
      - DATA_DIR=/data
      - PORT=8080
      # - DOWNLOAD_THREADS=8
      # - ACCESS_PASSWORD=your_password_here
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
