x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  freshrss:
    image: freshrss/freshrss
    profiles:
      - rss
    container_name: freshrss
    hostname: freshrss
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - freshrss_data:/var/www/FreshRSS/data
      - ./extensions:/var/www/FreshRSS/extensions
    environment:
      TZ: Asia/Shanghai
      CRON_MIN: "3,33"
      FRESHRSS_INSTALL: |-
        --api-enabled
        --base-url ${BASE_URL}
        --db-base ${DB_BASE}
        --db-host ${DB_HOST}
        --db-password ${DB_PASSWORD}
        --db-type ${DB_TYPE}
        --db-user ${DB_USER}
        --default_user ${DEFAULT_USER}
        --language en
      FRESHRSS_USER: |-
        --api-password ${ADMIN_API_PASSWORD}
        --email ${ADMIN_EMAIL}
        --language en
        --password ${ADMIN_PASSWORD}
        --user ${DEFAULT_USER}

volumes:
  freshrss_data:
