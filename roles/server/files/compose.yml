include:
  - path: ./rss/compose.yml
  - path: ./rsshub/compose.yml
  - path: ./asspp/compose.yml

services:
  caddy:
    container_name: caddy
    image: iarekylew00t/caddy-cloudflare
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    expose:
      - "9180"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/site:/srv
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - path: .env
      - path: ./rss/.env
        required: false
      - path: ./rsshub/.env
        required: false
      - path: ./asspp/.env
        required: false
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    expose:
      - "9090"

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SERVER_ROOT_URL=https://${GRAFANA_SUB_DOMAIN:-grafana}.${DOMAIN}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    expose:
      - "3000"

  xray:
    container_name: xray
    image: ghcr.io/xtls/xray-core
    depends_on:
      - caddy
    restart: always
    ports:
      - "${REALITY_PORT}:${REALITY_PORT}"
      - "${API_PORT}:${API_PORT}"
    expose:
      - "${XHTTP_PORT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./xray/:/usr/local/etc/xray/
      - caddy_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  warp:
    container_name: warp
    image: monius/docker-warp-socks:v5
    restart: unless-stopped
    privileged: true
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    expose:
      - "9091"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-x",
          "socks5h://127.0.0.1:9091",
          "-f",
          "https://www.cloudflare.com/cdn-cgi/trace",
        ]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
