---
- name: Stop client on OpenWrt
  when: service_on_openwrt
  block:
    - name: Check whether OpenWrt init script exists
      ansible.builtin.stat:
        path: "/etc/init.d/{{ service_name }}"
      register: common_stop_openwrt_init

    - name: Read OpenWrt enable flag
      ansible.builtin.command:
        argv: [uci, -q, get, "{{ service_openwrt_uci_key }}"]
      register: common_stop_uci
      changed_when: false
      failed_when: common_stop_uci.rc not in [0, 1]
      check_mode: false

    - name: Disable existing OpenWrt UCI flag
      ansible.builtin.command:
        argv: [uci, batch]
        stdin: |-
          set {{ service_openwrt_uci_key }}='0'
          commit {{ service_openwrt_uci_package }}
      when:
        - common_stop_uci.rc == 0
        - common_stop_uci.stdout != '0'
      changed_when: true

    - name: Stop and disable installed OpenWrt service
      community.general.openwrt_init:
        name: "{{ service_name }}"
        enabled: false
        state: stopped
      when: common_stop_openwrt_init.stat.exists

- name: Stop client on systemd Linux
  when:
    - not service_on_openwrt
    - ansible_facts['system'] == 'Linux'
  block:
    - name: Discover installed services
      ansible.builtin.service_facts:

    - name: Stop and disable installed systemd service
      become: "{{ use_become | default(true) }}"
      ansible.builtin.systemd_service:
        name: "{{ service_name }}.service"
        enabled: false
        state: stopped
      when: (service_name ~ '.service') in ansible_facts.services

- name: Stop client on macOS
  when: ansible_facts['system'] == 'Darwin'
  block:
    - name: Check whether the Homebrew formula is installed
      ansible.builtin.command:
        argv: [brew, list, --formula, "{{ service_name }}"]
      register: common_stop_brew_formula
      changed_when: false
      failed_when: common_stop_brew_formula.rc not in [0, 1]
      check_mode: false
      environment:
        HOMEBREW_NO_AUTO_UPDATE: "1"

    # Always unregister, even if the job is currently crashed/stopped but scheduled
    # to auto-start at login. The module's absent state skips that case.
    - name: Stop and unregister installed Homebrew service
      ansible.builtin.command:
        argv: [brew, services, stop, "{{ service_name }}"]
      register: common_stop_brew
      changed_when: "'Successfully stopped' in common_stop_brew.stdout"
      when: common_stop_brew_formula.rc == 0
      environment:
        HOMEBREW_NO_AUTO_UPDATE: "1"
