---
- name: Abort when package manager is not pacman
  ansible.builtin.fail:
    msg: "pacman is required for installing {{ service_name }} (expected on Arch/CachyOS)."
  when: ansible_facts.pkg_mgr != 'pacman'

- name: Install packages via pacman for {{ service_name }}
  become: "{{ use_become | default(true) }}"
  community.general.pacman:
    name: "{{ package_list }}"
    state: present
    update_cache: true

- name: Deploy systemd unit for {{ service_name }}
  become: "{{ use_become | default(true) }}"
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ service_name }}.service"
    mode: "0644"
    content: "{{ service_content }}"
  notify: "{{ service_notify | default([]) }}"

- name: Ensure {{ service_name }} service is enabled and started
  become: "{{ use_become | default(true) }}"
  ansible.builtin.systemd:
    name: "{{ service_name }}.service"
    enabled: true
    state: started
    daemon_reload: true
