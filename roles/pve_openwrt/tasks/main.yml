---
- name: Ensure OpenWrt image directory exists
  ansible.builtin.file:
    path: "{{ openwrt_image_dir }}"
    state: directory
    mode: "0755"

- name: Ensure Proxmox API Python dependencies are installed
  become: "{{ use_become | default(true) }}"
  ansible.builtin.package:
    name: python3-proxmoxer
    state: present

- name: Download OpenWrt image archive
  ansible.builtin.get_url:
    url: "{{ openwrt_image_url }}"
    dest: "{{ openwrt_image_archive_path }}"
    mode: "0644"
    checksum: "{{ openwrt_image_checksum }}"

- name: Decompress OpenWrt image
  ansible.builtin.command:
    argv:
      - gzip
      - -dk
      - "{{ openwrt_image_archive_path }}"
  args:
    creates: "{{ openwrt_image_path }}"
  when: openwrt_image_archive_path is search("\\.gz$")

- name: Ensure OpenWrt VM exists
  community.proxmox.proxmox_kvm:
    node: "{{ openwrt_proxmox_node }}"
    vmid: "{{ openwrt_vm_id }}"
    name: "{{ openwrt_vm_name }}"
    memory: "{{ openwrt_vm_memory }}"
    cores: "{{ openwrt_vm_cores }}"
    net:
      net0: "{{ openwrt_vm_net0 }}"
    ipconfig:
      ipconfig0: "{{ openwrt_vm_ipconfig0 }}"
    hostpci: "{{ openwrt_vm_hostpci if openwrt_vm_hostpci | length > 0 else omit }}"
    scsihw: "{{ openwrt_vm_scsihw }}"
    machine: "{{ openwrt_vm_machine }}"
    ostype: l26
    onboot: "{{ openwrt_vm_onboot }}"
    state: present
    update: true

- name: Read OpenWrt VM config
  ansible.builtin.command: "qm config {{ openwrt_vm_id }}"
  register: openwrt_vm_config
  changed_when: false

- name: Detect OpenWrt disk attachment
  ansible.builtin.set_fact:
    openwrt_disk_attached: >-
      {{
        openwrt_vm_config.stdout
        | regex_search('^' ~ openwrt_vm_disk_interface ~ ':', multiline=True)
        is not none
      }}
    openwrt_unused_disks: >-
      {{
        openwrt_vm_config.stdout
        | regex_findall('^unused\d+:\s*([^,\n]+)', multiline=True)
      }}

- name: Import and attach OpenWrt disk
  when: not openwrt_disk_attached
  block:
    - name: Import OpenWrt disk into Proxmox storage
      ansible.builtin.command:
        argv:
          - qm
          - importdisk
          - "{{ openwrt_vm_id }}"
          - "{{ openwrt_image_path }}"
          - "{{ openwrt_vm_storage }}"
      changed_when: true
      when: openwrt_unused_disks | length == 0

    - name: Read imported OpenWrt disk
      ansible.builtin.command: "qm config {{ openwrt_vm_id }}"
      register: openwrt_vm_config_after_import
      changed_when: false

    - name: Find imported OpenWrt disks
      ansible.builtin.set_fact:
        openwrt_imported_disks: >-
          {{
            openwrt_vm_config_after_import.stdout
            | regex_findall('^unused\d+:\s*([^,\n]+)', multiline=True)
          }}

    - name: Require an imported OpenWrt disk
      ansible.builtin.assert:
        that: openwrt_imported_disks | length > 0
        fail_msg: qm importdisk completed without creating an unused disk.

    - name: Select imported OpenWrt disk
      ansible.builtin.set_fact:
        openwrt_disk_volume: "{{ openwrt_imported_disks | first }}"

    - name: Attach imported OpenWrt disk
      community.proxmox.proxmox_kvm:
        node: "{{ openwrt_proxmox_node }}"
        vmid: "{{ openwrt_vm_id }}"
        scsi: "{{ { openwrt_vm_disk_interface: openwrt_disk_volume } }}"
        update: true
        update_unsafe: true

- name: Refresh OpenWrt VM config
  ansible.builtin.command: "qm config {{ openwrt_vm_id }}"
  register: openwrt_vm_config
  changed_when: false

- name: Detect OpenWrt disk size
  ansible.builtin.set_fact:
    openwrt_disk_size: >-
      {{
        [
          openwrt_vm_config.stdout
          | regex_search(
              '^' ~ openwrt_vm_disk_interface ~ ':.*size=([^,\n]+)',
              '\\1',
              multiline=True
            )
        ] | flatten | first | default('0', true)
      }}

- name: Grow OpenWrt virtual disk
  ansible.builtin.command:
    argv:
      - qm
      - resize
      - "{{ openwrt_vm_id }}"
      - "{{ openwrt_vm_disk_interface }}"
      - "{{ openwrt_vm_disk_size }}"
  when:
    - openwrt_disk_size | human_to_bytes < openwrt_vm_disk_size | human_to_bytes

- name: Read OpenWrt VM status
  ansible.builtin.command: "qm status {{ openwrt_vm_id }}"
  register: openwrt_vm_status
  changed_when: false

- name: Expand OpenWrt ext4 root filesystem
  when:
    - openwrt_image_type is search('ext4')
    - openwrt_vm_status.stdout is search('stopped')
  ansible.builtin.shell: |
    set -euo pipefail
    vol="$(qm config {{ openwrt_vm_id }} | awk -v iface='{{ openwrt_vm_disk_interface }}:' '$1 == iface { print $2; exit }' | cut -d, -f1)"
    disk="$(pvesm path "$vol")"
    loop="$(losetup --show -f -P "$disk")"
    cleanup() { losetup -d "$loop" || true; }
    trap cleanup EXIT
    echo ',+' | sfdisk --force -N 2 "$loop"
    losetup -d "$loop"
    trap - EXIT
    loop="$(losetup --show -f -P "$disk")"
    trap cleanup EXIT
    set +e
    e2fsck -f -y "${loop}p2"
    fsck_rc=$?
    set -e
    [ "$fsck_rc" -eq 0 ] || [ "$fsck_rc" -eq 1 ]
    resize2fs "${loop}p2"
  register: openwrt_fs_expand
  changed_when: >-
    'Nothing to do' not in openwrt_fs_expand.stdout
    and 'already' not in (openwrt_fs_expand.stderr | default(''))

- name: Ensure OpenWrt VM settings
  community.proxmox.proxmox_kvm:
    node: "{{ openwrt_proxmox_node }}"
    vmid: "{{ openwrt_vm_id }}"
    boot: "order={{ openwrt_vm_disk_interface }}"
    onboot: "{{ openwrt_vm_onboot }}"
    update: true
  when: >-
    openwrt_vm_config.stdout is not search(
      '^boot: order=' ~ openwrt_vm_disk_interface,
      multiline=True
    )
    or openwrt_vm_config.stdout is not search(
      '^onboot: ' ~ (openwrt_vm_onboot | ternary('1', '0')),
      multiline=True
    )

- name: Start OpenWrt VM
  community.proxmox.proxmox_kvm:
    node: "{{ openwrt_proxmox_node }}"
    vmid: "{{ openwrt_vm_id }}"
    state: started
  when: openwrt_vm_start | bool
