---
- name: Ensure target is Arch Linux
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == "Archlinux"
    fail_msg: "The arch_bootstrap role only supports Arch Linux targets."
    success_msg: "Arch Linux detected; proceeding with bootstrap packages."

- name: Check for /etc/os-release
  ansible.builtin.stat:
    path: /etc/os-release
  register: arch_os_release_stat

- name: Read /etc/os-release
  ansible.builtin.slurp:
    path: /etc/os-release
  register: arch_os_release_raw
  when: arch_os_release_stat.stat.exists

- name: Derive os-release id
  ansible.builtin.set_fact:
    arch_os_release_id: >-
      {{
        (
          arch_os_release_raw.content
          | default('')
          | b64decode
          | regex_search('(?mi)^ID=(.+)$')
          | regex_replace('^\"|\"$', '')
          | lower
        ) | default('')
      }}
  when: arch_os_release_stat.stat.exists

- name: Detect CachyOS derivative
  ansible.builtin.set_fact:
    is_cachyos: >-
      {{
        'cachyos' in (ansible_facts.get('distribution', '') | lower)
        or 'cachyos' in (
          arch_os_release_raw.content
          | default('')
          | b64decode
          | lower
        )
      }}

- name: Bootstrap Arch Linux hosts
  when: ansible_facts['os_family'] == "Archlinux"
  tags:
    - arch_bootstrap
  block:
    - name: Ensure base packages are installed
      become: true
      ansible.builtin.pacman:
        name: "{{ arch_bootstrap_packages }}"
        state: present
        update_cache: true

    - name: Debug system info
      ansible.builtin.debug:
        msg: >-
          Detected OS: {{ ansible_facts['distribution'] }}
          (family: {{ ansible_facts['os_family'] }}; os-release id: {{ arch_os_release_id | default('n/a') }})

    - name: Add archlinuxcn repository to pacman.conf
      become: true
      ansible.builtin.blockinfile:
        path: /etc/pacman.conf
        marker: "# {mark} ANSIBLE MANAGED BLOCK archlinuxcn"
        block: |
          [archlinuxcn]
          Server = https://repo.archlinuxcn.org/$arch

    - name: Optimize mirrors for CachyOS
      when: is_cachyos | bool
      block:
        - name: Install cachyos-rate-mirrors on CachyOS
          become: true
          ansible.builtin.pacman:
            name: cachyos-rate-mirrors
            state: present

        - name: Optimize mirrors using cachyos-rate-mirrors
          become: true
          ansible.builtin.shell: |
            cachyos-rate-mirrors --country {{ mirror_countries | join(',') }} --save /etc/pacman.d/mirrorlist
          register: cachyos_mirror_update
          changed_when: cachyos_mirror_update.rc == 0

    - name: Optimize mirrors for non-CachyOS hosts
      when: not is_cachyos | bool
      block:
        - name: Ensure reflector is installed
          become: true
          ansible.builtin.pacman:
            name: reflector
            state: present

        - name: Optimize mirrors using reflector
          become: true
          ansible.builtin.shell: |
            reflector {% for country in mirror_countries %}--country {{ country }} {% endfor %}--age 12 --protocol https --sort rate --save /etc/pacman.d/mirrorlist
          register: reflector_mirror_update
          changed_when: reflector_mirror_update.rc == 0

    - name: Update package database
      become: true
      ansible.builtin.pacman:
        update_cache: true

    - name: Install archlinuxcn keyring
      become: true
      ansible.builtin.pacman:
        name: archlinuxcn-keyring
        state: present

    - name: Install yay
      become: true
      ansible.builtin.pacman:
        name: yay
        state: present
      when: enable_yay

    - name: Upgrade all packages using yay
      become: true
      ansible.builtin.shell: yay -Syu --noconfirm
      register: yay_upgrade
      changed_when: "'there is nothing to do' not in yay_upgrade.stdout"
      when:
        - enable_yay
        - update_system
