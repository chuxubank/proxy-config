---
- name: Generate share text
  ansible.builtin.template:
    src: templates/xray/share.txt.j2
    dest: "{{ xray_config_dir }}/share.txt"

- name: Ensure xray log directory exists
  become: "{{ use_become }}"
  ansible.builtin.file:
    path: "{{ xray_log_dir }}"
    state: directory
    mode: "0755"
  notify:
    - Force xray log rotation
  tags: service

- name: Setup logrotate
  become: "{{ use_become }}"
  ansible.builtin.template:
    src: xray/logrotate.j2
    dest: "{{ xray_logrotate_config }}"
  notify:
    - Force xray log rotation

- name: Setup xray config
  ansible.builtin.template:
    src: xray/config_client.json.j2
    dest: "{{ xray_config_dir }}/99-config.json"
  notify:
    - Force xray log rotation
    - Stop xray service
    - Start xray service

- name: Install xray via Homebrew
  community.general.homebrew:
    name: xray
    state: present
  tags: install
