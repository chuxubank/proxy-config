- name: Force xray log rotation
  ansible.builtin.command:
    cmd: "logrotate -f {{ xray_logrotate_config }}"
  become: "{{ use_become }}"

- name: Restart xray service
  ansible.builtin.include_tasks: "{{ playbook_dir }}/roles/common/tasks/restart_service.yml"
  vars:
    service_name: xray
    service_template_content: "{{ lookup('template', xray_service_template) }}"
  listen: Restart xray service
