---
- name: Ensure xray config directory exists
  become: "{{ xray_is_openwrt | ternary(true, use_become | default(false)) }}"
  ansible.builtin.file:
    path: "{{ xray_config_dir }}"
    state: directory
    mode: "0755"
    owner: "{{ xray_is_openwrt | ternary('root', ansible_facts['user_id']) }}"

- name: Ensure xray log directory exists
  become: "{{ xray_is_openwrt | ternary(true, use_become | default(false)) }}"
  ansible.builtin.file:
    path: "{{ xray_log_dir }}"
    state: directory
    mode: "0755"
    owner: "{{ xray_is_openwrt | ternary('root', ansible_facts['user_id']) }}"

- name: Ensure logrotate config directory exists
  become: "{{ use_become | default(false) }}"
  ansible.builtin.file:
    path: "{{ logrotate_config_dir }}"
    state: directory
    mode: "0755"
  when: not xray_is_openwrt

- name: Setup logrotate
  become: "{{ use_become | default(false) }}"
  ansible.builtin.template:
    src: logrotate.j2
    dest: "{{ xray_logrotate_config }}"
  notify:
    - Force xray log rotation
  when: not xray_is_openwrt

- name: Read OpenWrt release info
  ansible.builtin.slurp:
    src: /etc/openwrt_release
  register: openwrt_release_file
  when: xray_is_openwrt

- name: Parse OpenWrt release info
  ansible.builtin.set_fact:
    openwrt_release: >-
      {{
        (openwrt_release_text | regex_findall("DISTRIB_RELEASE='([^']+)'"))
        | first
        | default('SNAPSHOT', true)
      }}
    openwrt_target: >-
      {{
        (openwrt_release_text | regex_findall("DISTRIB_TARGET='([^']+)'"))
        | first
      }}
    openwrt_arch: >-
      {{
        (openwrt_release_text | regex_findall("DISTRIB_ARCH='([^']+)'"))
        | first
      }}
  vars:
    openwrt_release_text: "{{ openwrt_release_file.content | b64decode }}"
  when: xray_is_openwrt

- name: Build OpenWrt mirror path
  ansible.builtin.set_fact:
    openwrt_opkg_release_path: >-
      {{
        openwrt_release == 'SNAPSHOT'
        | ternary('snapshots', 'releases/' ~ openwrt_release)
      }}
  when: xray_is_openwrt

- name: Configure OpenWrt opkg feeds
  ansible.builtin.template:
    src: "{{ playbook_dir }}/roles/pve_openwrt/templates/distfeeds.conf.j2"
    dest: /etc/opkg/distfeeds.conf
    mode: "0644"
  when: xray_is_openwrt

- name: Setup xray config
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ xray_config_file }}"
  notify:
    - Force xray log rotation
    - Restart xray service

- name: Include xray install tasks
  ansible.builtin.include_tasks: install.yml
  tags: install

- name: Render share text
  ansible.builtin.set_fact:
    xray_share_text: "{{ lookup('template', 'share.txt.j2') | trim }}"
  when: not xray_is_openwrt

- name: Display share links
  ansible.builtin.debug:
    msg: "{{ xray_share_text }}"
  when: xray_share_text != ""

- name: Print share QR code
  ansible.builtin.command:
    cmd: qrencode -t UTF8 "{{ xray_share_text }}"
  register: qrencode_output
  changed_when: false
  when:
    - xray_share_text != ""
    - not xray_is_openwrt

- name: Show QR code
  ansible.builtin.debug:
    msg: "{{ qrencode_output.stdout }}"
  when:
    - qrencode_output is defined
    - not xray_is_openwrt
