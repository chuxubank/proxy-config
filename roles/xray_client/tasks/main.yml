---
- name: Validate client service switch
  ansible.builtin.assert:
    that: xray_service_enabled is boolean
    fail_msg: xray_service_enabled must be a YAML boolean.
  tags: [always]

- name: Configure enabled client
  ansible.builtin.import_tasks: configure.yml
  when: xray_service_enabled

- name: Stop disabled client without installing or rendering secrets
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/../common/tasks/stop_service.yml"
    apply:
      tags: [service]
  vars:
    service_name: xray
    service_on_openwrt: "{{ xray_on_openwrt }}"
    service_openwrt_uci_key: xray.enabled.enabled
    service_openwrt_uci_package: xray
  when: not xray_service_enabled
  tags: [service]
