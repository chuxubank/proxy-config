---
- name: Ensure xray config directory exists
  ansible.builtin.file:
    path: "{{ xray_config_dir }}"
    state: directory
    mode: "0755"

- name: Ensure xray log directory exists
  ansible.builtin.file:
    path: "{{ xray_log_dir }}"
    state: directory
    mode: "0755"

- name: Ensure logrotate config directory exists
  ansible.builtin.file:
    path: "{{ logrotate_config_dir }}"
    state: directory
    mode: "0755"

- name: Setup logrotate
  ansible.builtin.template:
    src: logrotate.j2
    dest: "{{ xray_logrotate_config }}"
  notify:
    - Force xray log rotation

- name: Setup xray config
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ xray_config_dir }}/50-config.json"
  notify:
    - Force xray log rotation
    - Restart xray service

- name: Install xray via Homebrew
  community.general.homebrew:
    name: xray
    state: present
  tags: install

- name: Ensure qrencode is installed
  community.general.homebrew:
    name: qrencode
    state: present
  tags: install

- name: Render share text
  ansible.builtin.set_fact:
    xray_share_text: "{{ lookup('template', 'share.txt.j2') | trim }}"

- name: Display share links
  ansible.builtin.debug:
    msg: "{{ xray_share_text }}"
  when: xray_share_text != ""

- name: Print share QR code
  ansible.builtin.command:
    cmd: qrencode -t UTF8 "{{ xray_share_text }}"
  register: qrencode_output
  changed_when: false
  when: xray_share_text != ""

- name: Show QR code
  ansible.builtin.debug:
    msg: "{{ qrencode_output.stdout }}"
  when: qrencode_output is defined
