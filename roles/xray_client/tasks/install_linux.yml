- name: Render xray systemd unit content
  ansible.builtin.set_fact:
    xray_service_content: "{{ lookup('template', xray_service_template) }}"

- name: Install xray and service via pacman helper
  ansible.builtin.include_role:
    name: common
    tasks_from: install_pacman_service
  vars:
    package_list:
      - xray
      - qrencode
    service_name: xray
    service_content: "{{ xray_service_content }}"
    service_notify:
      - Restart xray service
