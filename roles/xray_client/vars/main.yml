xray_config_dir: "{{ ansible_facts['env']['HOME'] }}/.config/xray"
xray_log_dir: "{{ log_dir }}/xray"
xray_logrotate_config: "{{ logrotate_config_dir }}/xray"
xray_service_template: >-
  {%- if ansible_facts['system'] == 'Darwin' -%}
  service.plist.j2
  {%- elif ansible_facts['system'] == 'Linux' -%}
  service.systemd.j2
  {%- else -%}
  service.conf.j2
  {%- endif -%}
