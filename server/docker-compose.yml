version: "3"

services:
  caddy:
    container_name: caddy
    image: chuxubank/caddy-cloudflare
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/site:/srv
      - ./caddy/data:/data
      - ./caddy/config:/config
    environment:
      EMAIL: chuxubank@qq.com
      CF_API_TOKEN: Ce5IBLFCroR8ca2cXa3v1iFncYeydxe4LyK_MNvu
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  # v2ray:
  #   container_name: v2ray
  #   image: v2fly/v2fly-core
  #   restart: always
  #   volumes:
  #     - ./v2ray:/etc/v2ray

  xray:
    container_name: xray
    image: teddysun/xray
    restart: always
    ports:
      - "8443:8443/udp"
      - "8445:8445"
      - "8446:8446"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "2022"
    volumes:
      - ./xray:/etc/xray
      - ./caddy/data:/caddy/data
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

