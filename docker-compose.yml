version: "3"

services:
  caddy:
    container_name: caddy
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "433:433"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - /site:/srv
      - caddy_data:/data
      - caddy_config:/config
    links:
      - v2ray
  v2ray:
    container_name: v2ray
    image: v2fly/v2fly-core
    restart: always
    expose:
      - "10000"
    volumes:
      - ./config.json:/etc/v2ray/config.json

volumes:
  caddy_data:
  caddy_config:
