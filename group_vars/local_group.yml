---
use_become: >-
  {%- if ansible_system == 'Linux' -%}
  true
  {%- else -%}
  false
  {%- endif -%}

brew_path: >-
  {%- if ansible_system == 'Darwin' and ansible_architecture == 'arm64' -%}
  /opt/homebrew
  {%- elif ansible_system == 'Linux' -%}
  /home/linuxbrew/.linuxbrew
  {%- else -%}
  /usr/local
  {%- endif -%}

etc_path: >-
  {%- if ansible_system == 'Linux' -%}
  /etc
  {%- else -%}
  {{ brew_path }}/etc
  {%- endif -%}

var_path: >-
  {%- if ansible_system == 'Linux' -%}
  /var
  {%- else -%}
  {{ brew_path }}/var
  {%- endif -%}

log_dir: >-
  {%- if ansible_system == 'Darwin' -%}
  {{ ansible_env.HOME }}/Library/Logs
  {%- else -%}
  /var/log
  {%- endif -%}

logrotate_config_dir: "{{ etc_path }}/logrotate.d"
