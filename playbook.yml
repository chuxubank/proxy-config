---
- name: Setup VPS Proxy
  hosts: vps_group
  vars:
    proxy_config_dir: "proxy-config"
  roles:
    - common
    - server

- name: Setup Local Proxy
  hosts: local_group
  connection: local
  become: false

  vars:
    xray_config_dir: "{{ playbook_dir }}/client/xray"
    xray_log_dir: "{{ ansible_env.HOME }}/Library/Logs/Xray"
    xray_logrotate_config: "{{ ansible_env.HOME }}/.config/logrotate.d/xray"

  roles:
    - client
