---
- name: Setup VPS Proxy
  ansible.builtin.import_playbook: server.yml

- name: Setup Local Proxy
  hosts: local_group
  connection: local
  roles:
    - sing-box_client

- name: Setup Proxmox workloads
  hosts: pve_group
  environment: "{{ proxmox_api_env | default({}) }}"
  roles:
    - pve_openwrt

- name: Setup OpenWrt Proxy Client
  hosts: openwrt_group
  gather_facts: false
  roles:
    - openwrt
    - sing-box_client
