---
- name: Setup VPS Proxy
  hosts: vps_group
  roles:
    - common
    - server

- name: Setup Local Proxy
  hosts: local_group
  connection: local
  roles:
    - xray_client
    - sing-box_client

- name: Setup Proxmox OpenWrt VM
  hosts: pve_group
  environment: "{{ proxmox_api_env | default({}) }}"
  roles:
    - pve_openwrt

- name: Setup OpenWrt Xray Client
  hosts: openwrt_group
  vars_files:
    - roles/pve_openwrt/vars/openwrt_mirror.yml
  roles:
    - xray_client
