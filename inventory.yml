all:
  hosts:
    bwg-cn2-gia:

    localhost:
      ansible_connection: local

    pve:
      pve_pass_path: "Network/Home/PVE/ssh"

  children:
    vps_group:
      hosts:
        bwg-cn2-gia:
      vars:
        cf_pass_path: "Network/Host/Cloudflare"
        rss_pass_path: "Network/Host/FreshRSS/web"
        rss_api_pass_path: "Network/Host/FreshRSS/api"
        grafana_pass_path: "Network/Host/Grafana/admin"
        prom_pass_path: "Network/Host/Prometheus/web"

    xray_group:
      hosts:
        bwg-cn2-gia:
        localhost:
      vars:
        proxy_pass_path: "Network/Host/BandwagonHost/CN2/ssh"
        xray_client_pass_path: "Network/Xray/Client/Misaka"
        xray_reality_pass_path: "Network/Xray/Reality"
        xray_xhttp_pass_path: "Network/Xray/XHTTP"

    local_group:
      hosts:
        localhost:

    pve_group:
      hosts:
        pve:

    openwrt_group:
      hosts: {}
