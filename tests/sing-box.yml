---
- name: Validate sing-box client templates
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    host_env: ""
    brew_path: /opt/homebrew
    log_dir: /tmp/sing-box-ci/logs
    logrotate_config_dir: /tmp/sing-box-ci/logrotate
    sing_box_icloud_profile: false
    sing_box_windows_profile: false
    sing_box_template: "{{ playbook_dir }}/../roles/sing-box_client/templates/config.json.j2"
    sing_box_ci_render_dir: "{{ playbook_dir }}/.render"
    sing_box_tailscale_auth_token: tskey-auth-ci000000000000000000000000
    sing_box_invalley_server: proxy.example.test
    sing_box_invalley_uuid: 00000000-0000-4000-8000-000000000001
    sing_box_invalley_ws_path: /ray/ci-test
    xray_env:
      ADDRESS: 203.0.113.10
      DOMAIN: example.test
      CLIENT_ID: 00000000-0000-4000-8000-000000000000
      REALITY_TARGET: www.cloudflare.com
      REALITY_PUBLIC_KEY: 0123456789abcdef0123456789abcdef0123456789a
      REALITY_SHORT_ID: abcd1234
      REALITY_PORT: 443
  tasks:
    - name: Load sing-box role vars
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/sing-box_client/vars/main.yml"

    - name: Ensure render directory exists
      ansible.builtin.file:
        path: "{{ sing_box_ci_render_dir }}"
        state: directory
        mode: "0755"

    - name: Render workstation profile
      ansible.builtin.template:
        src: "{{ sing_box_template }}"
        dest: "{{ sing_box_ci_render_dir }}/workstation.json"
        mode: "0600"
        validate: sing-box check -c %s

    - name: Render IV workstation profile
      ansible.builtin.template:
        src: "{{ sing_box_template }}"
        dest: "{{ sing_box_ci_render_dir }}/iv.json"
        mode: "0600"
        validate: sing-box check -c %s
      vars:
        host_env: iv

    - name: Render Windows profile
      ansible.builtin.template:
        src: "{{ sing_box_template }}"
        dest: "{{ sing_box_ci_render_dir }}/windows.json"
        mode: "0600"
        validate: sing-box check -c %s
      vars:
        host_env: iv
        sing_box_windows_profile: true

    - name: Render iCloud profile
      ansible.builtin.template:
        src: "{{ sing_box_template }}"
        dest: "{{ sing_box_ci_render_dir }}/icloud.json"
        mode: "0600"
        validate: sing-box check -c %s
      vars:
        host_env: iv
        sing_box_icloud_profile: true

    # auto_redirect can only be initialized and validated on its target Linux host.
    - name: Select OpenWrt template branch
      ansible.builtin.set_fact:
        sing_box_on_openwrt: true

    - name: Render OpenWrt profile
      ansible.builtin.template:
        src: "{{ sing_box_template }}"
        dest: "{{ sing_box_ci_render_dir }}/openwrt.json.test"
        mode: "0600"

    - name: Restore workstation template branch
      ansible.builtin.set_fact:
        sing_box_on_openwrt: false

    - name: Load workstation profile
      ansible.builtin.slurp:
        src: "{{ sing_box_ci_render_dir }}/workstation.json"
      register: sing_box_ci_workstation_file

    - name: Load IV workstation profile
      ansible.builtin.slurp:
        src: "{{ sing_box_ci_render_dir }}/iv.json"
      register: sing_box_ci_iv_file

    - name: Load Windows profile
      ansible.builtin.slurp:
        src: "{{ sing_box_ci_render_dir }}/windows.json"
      register: sing_box_ci_windows_file

    - name: Load iCloud profile
      ansible.builtin.slurp:
        src: "{{ sing_box_ci_render_dir }}/icloud.json"
      register: sing_box_ci_icloud_file

    - name: Load OpenWrt profile
      ansible.builtin.slurp:
        src: "{{ sing_box_ci_render_dir }}/openwrt.json.test"
      register: sing_box_ci_openwrt_file

    - name: Decode rendered profiles
      ansible.builtin.set_fact:
        sing_box_ci_workstation: "{{ sing_box_ci_workstation_file.content | b64decode | from_json }}"
        sing_box_ci_iv: "{{ sing_box_ci_iv_file.content | b64decode | from_json }}"
        sing_box_ci_windows: "{{ sing_box_ci_windows_file.content | b64decode | from_json }}"
        sing_box_ci_icloud: "{{ sing_box_ci_icloud_file.content | b64decode | from_json }}"
        sing_box_ci_openwrt: "{{ sing_box_ci_openwrt_file.content | b64decode | from_json }}"

    - name: Assert IV profile includes the Invalley VMess outbound
      vars:
        invalley_outbound: >-
          {{ sing_box_ci_iv.outbounds | selectattr('tag', 'equalto', 'proxy-iv-remote') | first }}
      ansible.builtin.assert:
        that:
          - sing_box_ci_iv.outbounds | selectattr('tag', 'equalto', 'proxy-iv-remote') | list | length == 1
          - invalley_outbound.type == "vmess"
          - invalley_outbound.server == sing_box_invalley_server
          - invalley_outbound.tls.server_name == sing_box_invalley_server
          - invalley_outbound.uuid == sing_box_invalley_uuid
          - invalley_outbound.transport.type == "ws"
          - invalley_outbound.transport.path == sing_box_invalley_ws_path
          - invalley_outbound.tls.enabled
          - >-
            'proxy-iv-remote' in
            (sing_box_ci_iv.outbounds | selectattr('tag', 'equalto', 'select') | first).outbounds
          - >-
            'proxy-iv-remote' in
            (sing_box_ci_iv.outbounds | selectattr('tag', 'equalto', 'proxy') | first).outbounds
        quiet: true

    - name: Assert non-IV and portable profiles route Invalley before other outbound rules
      vars:
        invalley_route:
          domain_suffix: [invalley.co]
          outbound: proxy-iv-remote
      ansible.builtin.assert:
        that:
          - item.route.rules[2] == invalley_route
          - item.outbounds | selectattr('tag', 'equalto', 'proxy-iv-remote') | list | length == 1
          - item.outbounds | selectattr('tag', 'equalto', 'proxy-iv') | list | length == 0
          - >-
            'proxy-iv-remote' in
            (item.outbounds | selectattr('tag', 'equalto', 'select') | first).outbounds
          - >-
            'proxy-iv-remote' in
            (item.outbounds | selectattr('tag', 'equalto', 'proxy') | first).outbounds
          - item.route.final == 'select'
        quiet: true
      loop:
        - "{{ sing_box_ci_workstation }}"
        - "{{ sing_box_ci_windows }}"
        - "{{ sing_box_ci_icloud }}"
        - "{{ sing_box_ci_openwrt }}"
      loop_control:
        label: "{{ item.inbounds[0].stack }}"

    - name: Assert IV workstation does not force Invalley through the remote outbound
      ansible.builtin.assert:
        that:
          - >-
            sing_box_ci_iv.route.rules | selectattr('outbound', 'defined') |
            selectattr('outbound', 'equalto', 'proxy-iv-remote') | list | length == 0
          - sing_box_ci_iv.outbounds | selectattr('tag', 'equalto', 'proxy-iv') | list | length == 1
        quiet: true

    - name: Assert workstation profile keeps logs and API
      ansible.builtin.assert:
        that:
          - sing_box_ci_workstation.log.output is defined
          - sing_box_ci_workstation.services | length > 0
        quiet: true

    - name: Assert Windows profile drops logs and keeps API
      ansible.builtin.assert:
        that:
          - sing_box_ci_windows.log.output is not defined
          - sing_box_ci_windows.services | length > 0
          - '"xray.exe" in (sing_box_ci_windows | to_json)'
        quiet: true

    - name: Assert iCloud profile drops logs and API
      ansible.builtin.assert:
        that:
          - sing_box_ci_icloud.log.output is not defined
          - sing_box_ci_icloud.services is not defined
        quiet: true

    - name: Assert OpenWrt profile stays compatible with the 1.13 release package
      ansible.builtin.assert:
        that:
          - sing_box_ci_openwrt.http_clients is not defined
          - sing_box_ci_openwrt.route.default_http_client is not defined
          - sing_box_ci_openwrt.inbounds[0].auto_redirect
          - sing_box_ci_openwrt.endpoints is not defined
        quiet: true
