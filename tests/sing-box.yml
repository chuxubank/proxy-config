---
- name: Validate sing-box client templates
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    host_env: ""
    brew_path: /opt/homebrew
    log_dir: /tmp/sing-box-ci/logs
    logrotate_config_dir: /tmp/sing-box-ci/logrotate
    sing_box_icloud_profile: false
    sing_box_windows_profile: false
    sing_box_template: "{{ playbook_dir }}/../roles/sing-box_client/templates/config.json.j2"
    sing_box_ci_render_dir: "{{ playbook_dir }}/.render"
    sing_box_tailscale_auth_token: tskey-auth-ci000000000000000000000000
    sing_box_tailscale_relay_server_port: 40000
    sing_box_tailscale_relay_static_endpoints:
      - 203.0.113.15:40000
    sing_box_tailscale_advertise_tags:
      - tag:relay
    sing_box_invalley_server: proxy.example.test
    sing_box_invalley_uuid: 00000000-0000-4000-8000-000000000001
    sing_box_invalley_ws_path: /ray/ci-test
    xray_env:
      ADDRESS: 203.0.113.10
      DOMAIN: example.test
      CLIENT_ID: 00000000-0000-4000-8000-000000000000
      REALITY_TARGET: www.cloudflare.com
      REALITY_PUBLIC_KEY: 0123456789abcdef0123456789abcdef0123456789a
      REALITY_SHORT_ID: abcd1234
      REALITY_PORT: 443
  tasks:
    - name: Load sing-box role vars
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/sing-box_client/vars/main.yml"

    - name: Ensure render directory exists
      ansible.builtin.file:
        path: "{{ sing_box_ci_render_dir }}"
        state: directory
        mode: "0755"

    - name: Render workstation profile
      ansible.builtin.template:
        src: "{{ sing_box_template }}"
        dest: "{{ sing_box_ci_render_dir }}/workstation.json"
        mode: "0600"
        validate: sing-box check -c %s

    - name: Render IV workstation profile
      ansible.builtin.template:
        src: "{{ sing_box_template }}"
        dest: "{{ sing_box_ci_render_dir }}/iv.json"
        mode: "0600"
        validate: sing-box check -c %s
      vars:
        host_env: iv

    - name: Render Windows profile
      ansible.builtin.template:
        src: "{{ sing_box_template }}"
        dest: "{{ sing_box_ci_render_dir }}/windows.json"
        mode: "0600"
        validate: sing-box check -c %s
      vars:
        sing_box_windows_profile: true

    - name: Render iCloud profile
      ansible.builtin.template:
        src: "{{ sing_box_template }}"
        dest: "{{ sing_box_ci_render_dir }}/icloud.json"
        mode: "0600"
        validate: sing-box check -c %s
      vars:
        sing_box_icloud_profile: true

    # auto_redirect can only be initialized and validated on its target Linux host.
    - name: Select OpenWrt template branch
      ansible.builtin.set_fact:
        sing_box_on_openwrt: true

    - name: Render OpenWrt profile
      ansible.builtin.template:
        src: "{{ sing_box_template }}"
        dest: "{{ sing_box_ci_render_dir }}/openwrt.json.test"
        mode: "0600"

    - name: Render OpenWrt profile with relay overrides
      ansible.builtin.template:
        src: "{{ sing_box_template }}"
        dest: "{{ sing_box_ci_render_dir }}/openwrt-relay-override.json.test"
        mode: "0600"
      vars:
        sing_box_tailscale_relay_server_port: 40001
        sing_box_tailscale_relay_static_endpoints:
          - 198.51.100.20:40001
        sing_box_tailscale_advertise_tags:
          - tag:relay-ci

    - name: Restore workstation template branch
      ansible.builtin.set_fact:
        sing_box_on_openwrt: false

    - name: Load workstation profile
      ansible.builtin.slurp:
        src: "{{ sing_box_ci_render_dir }}/workstation.json"
      register: sing_box_ci_workstation_file

    - name: Load IV workstation profile
      ansible.builtin.slurp:
        src: "{{ sing_box_ci_render_dir }}/iv.json"
      register: sing_box_ci_iv_file

    - name: Load Windows profile
      ansible.builtin.slurp:
        src: "{{ sing_box_ci_render_dir }}/windows.json"
      register: sing_box_ci_windows_file

    - name: Load iCloud profile
      ansible.builtin.slurp:
        src: "{{ sing_box_ci_render_dir }}/icloud.json"
      register: sing_box_ci_icloud_file

    - name: Load OpenWrt profile
      ansible.builtin.slurp:
        src: "{{ sing_box_ci_render_dir }}/openwrt.json.test"
      register: sing_box_ci_openwrt_file

    - name: Load OpenWrt relay override profile
      ansible.builtin.slurp:
        src: "{{ sing_box_ci_render_dir }}/openwrt-relay-override.json.test"
      register: sing_box_ci_openwrt_override_file

    - name: Decode rendered profiles
      ansible.builtin.set_fact:
        sing_box_ci_workstation: "{{ sing_box_ci_workstation_file.content | b64decode | from_json }}"
        sing_box_ci_iv: "{{ sing_box_ci_iv_file.content | b64decode | from_json }}"
        sing_box_ci_windows: "{{ sing_box_ci_windows_file.content | b64decode | from_json }}"
        sing_box_ci_icloud: "{{ sing_box_ci_icloud_file.content | b64decode | from_json }}"
        sing_box_ci_openwrt: "{{ sing_box_ci_openwrt_file.content | b64decode | from_json }}"
        sing_box_ci_openwrt_override: >-
          {{ sing_box_ci_openwrt_override_file.content | b64decode | from_json }}

    - name: Assert IV profile includes the Invalley VMess outbound
      vars:
        invalley_outbound: >-
          {{ sing_box_ci_iv.outbounds | selectattr('tag', 'equalto', 'proxy-iv-remote') | first }}
      ansible.builtin.assert:
        that:
          - sing_box_ci_iv.outbounds | selectattr('tag', 'equalto', 'proxy-iv-remote') | list | length == 1
          - invalley_outbound.type == "vmess"
          - invalley_outbound.server == sing_box_invalley_server
          - invalley_outbound.tls.server_name == sing_box_invalley_server
          - invalley_outbound.uuid == sing_box_invalley_uuid
          - invalley_outbound.transport.type == "ws"
          - invalley_outbound.transport.path == sing_box_invalley_ws_path
          - invalley_outbound.tls.enabled
          - >-
            'proxy-iv-remote' in
            (sing_box_ci_iv.outbounds | selectattr('tag', 'equalto', 'select') | first).outbounds
          - >-
            'proxy-iv-remote' in
            (sing_box_ci_iv.outbounds | selectattr('tag', 'equalto', 'proxy') | first).outbounds
        quiet: true

    - name: Assert every profile routes Invalley before other outbound rules
      vars:
        invalley_route:
          domain_suffix: [invalley.co]
          outbound: proxy-iv-remote
      ansible.builtin.assert:
        that:
          - item.route.rules[2] == invalley_route
          - item.inbounds[0].route_address is not defined
        quiet: true
      loop:
        - "{{ sing_box_ci_workstation }}"
        - "{{ sing_box_ci_iv }}"
        - "{{ sing_box_ci_windows }}"
        - "{{ sing_box_ci_icloud }}"
        - "{{ sing_box_ci_openwrt }}"
      loop_control:
        label: "{{ item.inbounds[0].stack }}"

    - name: Assert every profile keeps the Invalley remote outbound
      ansible.builtin.assert:
        that:
          - item.outbounds | selectattr('tag', 'equalto', 'proxy-iv-remote') | list | length == 1
          - >-
            'proxy-iv-remote' in
            (item.outbounds | selectattr('tag', 'equalto', 'select') | first).outbounds
          - >-
            'proxy-iv-remote' in
            (item.outbounds | selectattr('tag', 'equalto', 'proxy') | first).outbounds
          - item.route.final == 'select'
        quiet: true
      loop:
        - "{{ sing_box_ci_workstation }}"
        - "{{ sing_box_ci_iv }}"
        - "{{ sing_box_ci_windows }}"
        - "{{ sing_box_ci_icloud }}"
        - "{{ sing_box_ci_openwrt }}"
      loop_control:
        label: "{{ item.inbounds[0].stack }}"

    - name: Assert every profile routes selected suffix domains directly
      vars:
        direct_route: >-
          {{ item.route.rules | selectattr('outbound', 'defined') |
             selectattr('outbound', 'equalto', 'direct') | first }}
        direct_domains: >-
          {{ direct_route.rules | selectattr('domain_suffix', 'defined') | map(attribute='domain_suffix') | flatten }}
      ansible.builtin.assert:
        that:
          - "'b2clogin.com' in direct_domains"
          - "'roborock.com' in direct_domains"
          - "'rockrobo.com' in direct_domains"
        quiet: true
      loop:
        - "{{ sing_box_ci_workstation }}"
        - "{{ sing_box_ci_iv }}"
        - "{{ sing_box_ci_windows }}"
        - "{{ sing_box_ci_icloud }}"
        - "{{ sing_box_ci_openwrt }}"
      loop_control:
        label: "{{ item.inbounds[0].stack }}"

    - name: Assert IV workstation keeps the local HTTP outbound
      ansible.builtin.assert:
        that:
          - sing_box_ci_iv.outbounds | selectattr('tag', 'equalto', 'proxy-iv') | list | length == 1
        quiet: true

    - name: Assert workstation profile keeps logs and API
      ansible.builtin.assert:
        that:
          - sing_box_ci_workstation.log.output is defined
          - sing_box_ci_workstation.services | length > 0
        quiet: true

    - name: Assert default log level and only referenced rule sets
      vars:
        rule_set_tags: "{{ item.route.rule_set | map(attribute='tag') | list }}"
      ansible.builtin.assert:
        that:
          - item.log.level == 'info'
          - "'geosite-category-ads-all' not in rule_set_tags"
          - "'geosite-geolocation-!cn' not in rule_set_tags"
          - "'geosite-geolocation-cn' in rule_set_tags"
          - "'geosite-google' in rule_set_tags"
          - "'geosite-google-cn' in rule_set_tags"
          - "'geosite-apple-cn' in rule_set_tags"
          - "'geoip-cn' in rule_set_tags"
          - rule_set_tags | length == 5
        quiet: true
      loop:
        - "{{ sing_box_ci_workstation }}"
        - "{{ sing_box_ci_iv }}"
        - "{{ sing_box_ci_windows }}"
        - "{{ sing_box_ci_icloud }}"
        - "{{ sing_box_ci_openwrt }}"
      loop_control:
        label: "{{ item.inbounds[0].stack }}"

    - name: Assert Windows profile drops logs and keeps API
      ansible.builtin.assert:
        that:
          - sing_box_ci_windows.log.output is not defined
          - sing_box_ci_windows.services | length > 0
          - '"xray.exe" in (sing_box_ci_windows | to_json)'
        quiet: true

    - name: Assert iCloud profile drops logs and API
      ansible.builtin.assert:
        that:
          - sing_box_ci_icloud.log.output is not defined
          - sing_box_ci_icloud.services is not defined
        quiet: true

    - name: Assert non-OpenWrt DNS races the CN probe and keeps a stale cache
      vars:
        cn_probe: >-
          {{ item.dns.rules | selectattr('tag', 'defined')
             | selectattr('tag', 'equalto', 'cn-probe') | first }}
        cn_respond: >-
          {{ item.dns.rules | selectattr('match_response', 'defined')
             | selectattr('match_response', 'equalto', 'cn-probe') | first }}
        ts_probe: >-
          {{ item.dns.rules | selectattr('tag', 'defined')
             | selectattr('tag', 'equalto', 'ts-probe') | first }}
        ts_respond: >-
          {{ item.dns.rules | selectattr('match_response', 'defined')
             | selectattr('match_response', 'equalto', 'ts-probe') | first }}
      ansible.builtin.assert:
        that:
          - item.dns.optimistic | bool
          - cn_probe.server == "ali"
          - cn_probe.timeout == "2s"
          - cn_respond.race | bool
          - cn_respond.rule_set == "geoip-cn"
          - ts_probe.server == "ts"
          - ts_probe.speculative | bool
          - ts_respond.race is not defined
          - ts_respond.ip_accept_any | bool
        quiet: true
      loop:
        - "{{ sing_box_ci_workstation }}"
        - "{{ sing_box_ci_iv }}"
        - "{{ sing_box_ci_windows }}"
        - "{{ sing_box_ci_icloud }}"
      loop_control:
        label: "{{ item.inbounds[0].stack }}"

    - name: Assert non-OpenWrt profiles keep the full Tailscale endpoint
      vars:
        tailscale_endpoint: >-
          {{ item.endpoints | selectattr('tag', 'equalto', 'ts-ep') | first }}
      ansible.builtin.assert:
        that:
          - tailscale_endpoint.type == "tailscale"
          - tailscale_endpoint.auth_key == sing_box_tailscale_auth_token
          - tailscale_endpoint.accept_routes | bool
          - tailscale_endpoint.exit_node_allow_lan_access | bool
          - tailscale_endpoint.advertise_exit_node | bool
          - tailscale_endpoint.ssh_server | bool
          - tailscale_endpoint.relay_server_port is not defined
          - tailscale_endpoint.relay_server_static_endpoints is not defined
          - tailscale_endpoint.advertise_tags is not defined
        quiet: true
      loop:
        - "{{ sing_box_ci_workstation }}"
        - "{{ sing_box_ci_iv }}"
        - "{{ sing_box_ci_windows }}"
        - "{{ sing_box_ci_icloud }}"
      loop_control:
        label: "{{ item.inbounds[0].stack }}"

    - name: Assert OpenWrt profile stays compatible with the 1.13 release package
      ansible.builtin.assert:
        that:
          - sing_box_ci_openwrt.http_clients is not defined
          - sing_box_ci_openwrt.route.default_http_client is not defined
          - sing_box_ci_openwrt.dns.optimistic is not defined
          - "'\"race\"' not in (sing_box_ci_openwrt | to_json)"
          - "'\"speculative\"' not in (sing_box_ci_openwrt | to_json)"
          - "'\"ssh_server\"' not in (sing_box_ci_openwrt | to_json)"
          - sing_box_ci_openwrt.inbounds[0].auto_redirect
          - "'100.64.0.0/10' not in (sing_box_ci_openwrt | to_json)"
          - "'\"ts.net\"' not in (sing_box_ci_openwrt | to_json)"
          - "'ts-ep' not in (sing_box_ci_openwrt.route | to_json)"
        quiet: true

    - name: Assert OpenWrt relay defaults and the rendered peer relay endpoint
      vars:
        defaults_file: "{{ playbook_dir }}/../roles/sing-box_client/defaults/main.yml"
        client_defaults: "{{ lookup('ansible.builtin.file', defaults_file) | from_yaml }}"
        tailscale_endpoint: >-
          {{ sing_box_ci_openwrt.endpoints | selectattr('tag', 'equalto', 'ts-ep') | first }}
        override_endpoint: >-
          {{ sing_box_ci_openwrt_override.endpoints | selectattr('tag', 'equalto', 'ts-ep') | first }}
      ansible.builtin.assert:
        that:
          - client_defaults.sing_box_asus_pass_path == 'Network/Home/ASUS'
          - client_defaults.sing_box_tailscale_relay_server_port | int == 40000
          - client_defaults.sing_box_tailscale_advertise_tags == ['tag:relay']
          - sing_box_ci_openwrt.endpoints | length == 1
          - tailscale_endpoint.type == "tailscale"
          - tailscale_endpoint.tag == "ts-ep"
          - tailscale_endpoint.auth_key == sing_box_tailscale_auth_token
          - tailscale_endpoint.relay_server_port | int == 40000
          - tailscale_endpoint.relay_server_static_endpoints == ['203.0.113.15:40000']
          - tailscale_endpoint.advertise_tags == ['tag:relay']
          - tailscale_endpoint.ssh_server is not defined
          - tailscale_endpoint.advertise_exit_node is not defined
          - tailscale_endpoint.accept_routes is not defined
          - tailscale_endpoint.exit_node_allow_lan_access is not defined
          - sing_box_ci_openwrt_override.endpoints | length == 1
          - override_endpoint.relay_server_port | int == 40001
          - override_endpoint.relay_server_static_endpoints == ['198.51.100.20:40001']
          - override_endpoint.advertise_tags == ['tag:relay-ci']
          - override_endpoint.ssh_server is not defined
          - override_endpoint.advertise_exit_node is not defined
          - override_endpoint.accept_routes is not defined
          - override_endpoint.exit_node_allow_lan_access is not defined
        quiet: true
